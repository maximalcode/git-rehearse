# Weekly, batched, and quiet: one morning a week of dependency PRs beats a
# trickle. Cargo deps are few by design (SCOPE.md keeps the tree small);
# github-actions covers the pinned SHAs in workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    labels: [dependencies]
