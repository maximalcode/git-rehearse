name: quality

on: [push, pull_request]

# Read-only for every job, including the reusable one below: a called workflow
# inherits the caller's token, and this ceiling is deliberate. maxi-quality's
# quality.yml declares no permissions of its own and needs none beyond reading
# the tree — it checks out, downloads pinned tools, and renders Semgrep findings
# through `::error` workflow commands rather than the Checks API. SARIF upload is
# explicitly out of scope there, so `security-events: write` is not wanted either.
# If a future version does need more, widen it here per-job, not at the top.
permissions:
  contents: read

jobs:
  quality:
    # Pinned by commit-SHA, not by tag — the v1 tag couples this workflow and
    # its inner actions/layer2 reference (also SHA-pinned, as of maxi-quality#188)
    # so that a moved tag cannot silently change what runs. The comment records
    # the release lineage; bump the SHA deliberately alongside maxi-quality
    # releases, not automatically.
    uses: maximalcode/maxi-quality/.github/workflows/quality.yml@9d29bc6b9a498d2f863746158b4b4d891fd2f9a0 # v1.2.0

  # Rust Layer 1 (maxi-quality). Toolchain and cargo-deny are PINNED: with
  # warnings promoted to errors, an analyzer upgrade that adds lints is a
  # breaking change — bump both deliberately, never via a floating 'stable'.
  rust:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — nothing here talks to this repo over the
      # network after checkout, so leaving the token in .git/config for the rest
      # of the job only widens what a compromised build script could reach.
      # cargo-deny fetches the RustSec advisory database anonymously.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Pinned cargo-deny (checksum-verified)
        run: |
          curl -sSfL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tgz' | sha256sum -c -
          tar xzf /tmp/cargo-deny.tgz -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - run: cargo fmt --check
      # -Dwarnings HERE and not in the manifest: a contributor's local
      # `cargo check` should warn, not wall them. CI is the gate.
      - name: cargo clippy — all targets, warnings are errors
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --all-targets --locked
      # advisories covers what cargo-audit would (RustSec); 'licenses' gates
      # against the allowlist set in deny.toml (policy decided in #1).
      - run: cargo deny check advisories bans licenses
      - run: cargo test --locked

  # Every third-party action must be pinned to a full commit SHA.
  #
  # This is the same guard maxi-quality runs on itself (its ci.yml,
  # workflow-lint job), adapted here so git-rehearse does not depend on
  # maxi-quality to catch its own unpinned actions — a consumer that
  # adds a tag-pinned action sees it fail in CI, not weeks later when
  # Scorecard re-scans.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Third-party actions must be pinned to a full commit SHA, never a tag.
      # A tag is mutable: whoever controls it can point it at new code, and
      # that code then runs in CI with this repo's GITHUB_TOKEN.
      #
      # `maximalcode/*@<ref>` is exempt: our own repos, our own tags to move
      # (and the reusable workflow reference to maxi-quality is itself
      # SHA-pinned as of #45). The trailing `# vN` comment keeps Dependabot
      # working and lets a reviewer see at a glance which release lineage a
      # SHA belongs to.
      - name: Third-party actions must be SHA-pinned
        shell: bash
        run: |
          set -Eeuo pipefail
          bad=$(grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[A-Za-z0-9._-]+' \
                  .github/workflows/ \
                | grep -vE '@[0-9a-f]{40}' \
                | grep -vE '^uses: maximalcode/' \
                | sort -u || true)
          if [[ -n "$bad" ]]; then
            echo '::error::these actions are pinned to a MUTABLE tag — use the full commit SHA:'
            echo "$bad"
            echo 'Resolve with: gh api repos/OWNER/REPO/git/ref/tags/TAG --jq .object.sha'
            echo 'Keep the tag as a trailing comment so Dependabot can still bump it.'
            exit 1
          fi
          echo 'OK: every third-party action is pinned to a commit SHA'

      # No `curl | sh`, no `<(curl ...)`, no fetch-then-run without a
      # checksum. The same guard maxi-quality runs on itself; adopted here
      # because a workflow step that fetches and executes remote code without
      # pinning is an action by another name.
      - name: No unpinned remote code execution
        shell: bash
        run: |
          set -Eeuo pipefail
          PATTERN='(curl|wget)[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba)?sh'
          PATTERN+='|<\([[:space:]]*(curl|wget)'
          PATTERN+='|eval[^;]*(curl|wget)'
          PATTERN+='|(curl|wget)[^;&]*(&&|;)[[:space:]]*(sudo[[:space:]]+)?(ba)?sh([[:space:]]|$)'
          PATTERN+='|(curl|wget)[^;&]*(&&|;)[^;&]*chmod[[:space:]]+[^;&]*\+x'
          SCAN=(.github/workflows)
          # Exclude comments so this guard does not fail on its own explanation.
          bad=$(grep -rnE "$PATTERN" "${SCAN[@]}" \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [[ -n "$bad" ]]; then
            echo '::error::remote code is fetched and executed without a version pin and a checksum:'
            echo "$bad"
            echo 'Use a SHA-pinned action, or download a pinned release and verify it with sha256sum -c.'
            exit 1
          fi
          echo 'OK: no unpinned remote code execution'

  # The tests, on the platforms the release ships to. Only the tests: fmt,
  # clippy and cargo-deny read the same source and the same lockfile
  # everywhere, so running them three times would buy nothing. What differs
  # per platform is what `git` and the filesystem do — hardlinked clones,
  # path handling, the shell git runs the sequence editor through — and that
  # is exactly what the integration tests exercise.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - run: cargo test --locked
