name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    env:
      # The actual v1.3.0 release commit, never a mutable tag or develop.
      PREVIOUS_RELEASE_REVISION: 81a0621b4089749dfa899233a2a3ee06eacad44e
      PYTHONDONTWRITEBYTECODE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: candidate
      - name: Check out the supported upgrade baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: maximalcode/git-rehearse
          ref: ${{ env.PREVIOUS_RELEASE_REVISION }}
          path: previous
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }}
          rustup default 1.97.1
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build the previous release for real retained-data upgrades
        run: cargo build --manifest-path ../previous/Cargo.toml --release --locked --target ${{ matrix.target }}

      # PR/manual builds are test artifacts, even when dispatched against a tag.
      - name: Package, verify checksum, and test the unpacked binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          label="v${version}-test-${GITHUB_SHA}"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            label="$GITHUB_REF_NAME"
          fi
          previous_binary="../previous/target/${TARGET}/release/git-rehearse"
          if [[ "$TARGET" == *windows-msvc ]]; then
            previous_binary="${previous_binary}.exe"
          fi
          python3 scripts/release-artifact.py "$TARGET" "$label" \
            --previous-binary "$previous_binary" \
            --previous-source-revision "$PREVIOUS_RELEASE_REVISION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: candidate/dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the binaries to it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # --verify-tag: a release is only ever cut from a tag that exists here,
      # never from a name somebody typed.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --verify-tag \
            --generate-notes \
            artifacts/*
